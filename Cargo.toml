[workspace]
resolver = "3"
members = ["proto", "server", "client"]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]
proto = { path = "proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memory-stats = "1"
getrandom = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Debug builds: no debugging info for other people's libraries (most of the
# build folder's size), only file/line info for ours (enough for panics).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing is very slow without optimizations; keep tests quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
