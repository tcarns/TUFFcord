# Publishes a release whenever main has a version (in Cargo.toml) that hasn't
# been released yet: runs the tests, builds the Windows programs, then creates
# the vX.Y.Z tag and a GitHub Release with the zip. Running copies of TUFFcord
# check for the newest release and tell people an update is available.
#
# To publish: raise `version` in Cargo.toml, add a CHANGELOG.md section, push to main.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pinned: the Linux server is built here and needs a glibc no newer than
    # the rented server's (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    # Holds the release signing key; set up with "Required reviewers" so a
    # release waits for the owner's Approve click (docs/releasing.md).
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # tags, to build the previous release for the version checks
          # Steps that publish get the token explicitly; nothing else needs it on disk.
          persist-credentials: false

      - name: Is this version already released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; building it."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools (audio, Windows cross-compiler)
        if: steps.version.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake

      - name: Add the Windows target
        if: steps.version.outputs.new == 'true'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.version.outputs.new == 'true'

      - name: Run the tests
        if: steps.version.outputs.new == 'true'
        run: cargo test --workspace

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.version.outputs.new == 'true'
        with:
          python-version: "3.12"

      # End to end, including this version's app and server against the
      # previous release's (people update at different times).
      - name: End-to-end tests, with the previous release
        if: steps.version.outputs.new == 'true'
        run: |
          pip install --quiet websockets
          tests/run.py --compat

      - name: Build the app and the server
        if: steps.version.outputs.new == 'true'
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          # Static C runtime, so the programs need no extra DLLs.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: -C link-arg=-static -C link-arg=-static-libgcc
        run: cargo build --release --target x86_64-pc-windows-gnu -p tuffcord-server --bin TUFFcord-server -p tuffcord --bin TUFFcord

      - name: Build the Linux server
        if: steps.version.outputs.new == 'true'
        run: cargo build --release -p tuffcord-server --bin TUFFcord-server

      - name: Package
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist/TUFFcord
          cp target/x86_64-pc-windows-gnu/release/TUFFcord.exe dist/TUFFcord/TUFFcord.exe
          cp target/x86_64-pc-windows-gnu/release/TUFFcord-server.exe dist/TUFFcord/TUFFcord-server.exe
          sed 's/$/\r/' README.md > dist/TUFFcord/README.txt
          cd dist
          zip -r "TUFFcord-$TAG-windows.zip" TUFFcord
          # The raw programs are what the app and server download when they update
          # themselves. Copies under the old names are for copies from before the
          # rename to TUFFcord (0.7.1 and earlier), which look for those names.
          cp TUFFcord/TUFFcord.exe TUFFcord/TUFFcord-server.exe .
          cp TUFFcord.exe backroom.exe
          cp TUFFcord-server.exe backroom-server.exe
          # The server for a rented Linux machine (see docs/hosting.md).
          cp ../target/release/TUFFcord-server TUFFcord-server-linux-x86_64
          sha256sum TUFFcord.exe TUFFcord-server.exe backroom.exe backroom-server.exe TUFFcord-server-linux-x86_64 "TUFFcord-$TAG-windows.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Apps and servers from 0.11 install only releases signed with this key.
      - name: Sign the checksums
        if: steps.version.outputs.new == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is missing from the release environment (docs/releasing.md)."
            exit 1
          fi
          set -o pipefail
          umask 077
          # OpenSSH (ssh-keygen) or PEM; release-key.py turns either into PEM.
          printf '%s\n' "$RELEASE_SIGNING_KEY" | python3 tools/release-key.py > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/SHA256SUMS.txt -out "$RUNNER_TEMP/sig.bin"
          rm -f "$RUNNER_TEMP/key.pem"
          od -An -tx1 -v "$RUNNER_TEMP/sig.bin" | tr -d ' \n' > dist/SHA256SUMS.txt.sig
          echo >> dist/SHA256SUMS.txt.sig
          # Check it with the public key the programs carry.
          pub=$(grep -oE 'RELEASE_KEY: &str = "[0-9a-f]{64}"' proto/src/update.rs | grep -oE '[0-9a-f]{64}')
          printf '302a300506032b6570032100%s' "$pub" | sed 's/../\\x&/g' | xargs -0 printf '%b' > "$RUNNER_TEMP/pub.der"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" -rawin -in dist/SHA256SUMS.txt -sigfile "$RUNNER_TEMP/sig.bin"

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## " { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Bug fixes and improvements." > notes.md; fi
          cat notes.md

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/TUFFcord-$TAG-windows.zip" dist/TUFFcord.exe dist/TUFFcord-server.exe \
            dist/backroom.exe dist/backroom-server.exe dist/TUFFcord-server-linux-x86_64 dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig \
            --target "$GITHUB_SHA" --title "TUFFcord ${TAG#v}" --notes-file notes.md
