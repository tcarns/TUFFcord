# Builds a release whenever main has a version (in Cargo.toml) that hasn't
# been released yet: runs the tests, builds the programs, and puts them in a
# *draft* GitHub Release. Nothing reaches anyone until the owner signs the
# checksums on his own PC and runs the Publish workflow with the signature
# (docs/releasing.md). The signing key never comes near GitHub.
#
# To release: raise `version` in Cargo.toml, add a CHANGELOG.md section, push to main.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    # Write only so it can see drafts (runs no project code).
    permissions:
      contents: write
    outputs:
      new: ${{ steps.version.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Is this version already released (or drafted)?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released or drafted; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs everything (tests, every crate's build script) with no secrets and a
  # read-only token.
  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    # Pinned: the Linux server is built here and needs a glibc no newer than
    # the rented server's (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # tags, to build the previous release for the version checks
          persist-credentials: false

      - name: Install build tools (audio, Windows cross-compiler)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake

      - name: Add the Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run the tests
        run: cargo test --workspace

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # End to end, including this version's app and server against the
      # previous release's (people update at different times).
      - name: End-to-end tests, with the previous release
        run: |
          pip install --quiet --require-hashes -r tests/requirements.txt
          tests/run.py --compat

      - name: Build the app and the server
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          # Static C runtime, so the programs need no extra DLLs.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: -C link-arg=-static -C link-arg=-static-libgcc
        run: cargo build --release --target x86_64-pc-windows-gnu -p tuffcord-server --bin TUFFcord-server -p tuffcord --bin TUFFcord

      - name: Build the Linux server
        run: cargo build --release -p tuffcord-server --bin TUFFcord-server

      - name: Package
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p dist/TUFFcord
          cp target/x86_64-pc-windows-gnu/release/TUFFcord.exe dist/TUFFcord/TUFFcord.exe
          cp target/x86_64-pc-windows-gnu/release/TUFFcord-server.exe dist/TUFFcord/TUFFcord-server.exe
          sed 's/$/\r/' README.md > dist/TUFFcord/README.txt
          cd dist
          zip -r "TUFFcord-$TAG-windows.zip" TUFFcord
          # The raw programs are what the app and server download when they update
          # themselves. Copies under the old names are for copies from before the
          # rename to TUFFcord (0.7.1 and earlier), which look for those names.
          cp TUFFcord/TUFFcord.exe TUFFcord/TUFFcord-server.exe .
          cp TUFFcord.exe backroom.exe
          cp TUFFcord-server.exe backroom-server.exe
          # The server for a rented Linux machine (see docs/hosting.md).
          cp ../target/release/TUFFcord-server TUFFcord-server-linux-x86_64
          rm -rf TUFFcord
          # The version comes first, so the signature also says which release
          # this is (apps from 0.11.1 check it; older ones skip the line).
          { echo "version ${TAG#v}"
            sha256sum TUFFcord.exe TUFFcord-server.exe backroom.exe backroom-server.exe TUFFcord-server-linux-x86_64 "TUFFcord-$TAG-windows.zip"
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## " { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then echo "Bug fixes and improvements." > dist/notes.md; fi
          cat dist/notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Uploads the files as a draft release. Only this job can write, and it runs
  # no project code.
  draft:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: in/dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          cd in/dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            "TUFFcord-$TAG-windows.zip" TUFFcord.exe TUFFcord-server.exe backroom.exe backroom-server.exe \
            TUFFcord-server-linux-x86_64 SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "TUFFcord ${TAG#v}" --notes-file notes.md
          {
            echo "### $TAG is drafted. To publish it:"
            echo "1. Download **SHA256SUMS.txt** from the draft on the Releases page."
            echo "2. Sign it on your PC (docs/releasing.md) and copy the signature."
            echo "3. Actions → **Publish release** → Run workflow → version \`${TAG#v}\`, paste the signature."
          } >> "$GITHUB_STEP_SUMMARY"
