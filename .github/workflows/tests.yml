name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install audio and build libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Unit tests
        run: cargo test --workspace

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: End-to-end tests
        run: |
          pip install --quiet --require-hashes -r tests/requirements.txt
          tests/run.py

      - name: Memory and CPU budgets
        run: |
          sudo apt-get install -y xvfb xdotool libxkbcommon-x11-0 libgl1-mesa-dri libegl1
          tests/run.py perf
