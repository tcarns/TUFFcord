[package]
name = "proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Checking GitHub for new releases (used by the app and the server, not the test bot).
updates = ["dep:ureq", "dep:sha2", "dep:ed25519-compact"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["native-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
# Checking release signatures (no dependencies of its own, verify only).
ed25519-compact = { version = "2", default-features = false, optional = true }
